canonicalChapter:
  id: chapter-observation-vs-interpretation
  title: "Séparez le fait mesuré du scénario supposé"
  estimatedMinutes: 30
  question: "Lundi à 08:15 UTC, une alerte affirme : « Un attaquant externe tente de pirater Claire Moreau par force brute depuis 10.24.8.19 ». Le journal de srv-paie-01 ne montre que 3 refus de mot de passe en 7 secondes. Que sait-on réellement, et qu'est-ce qui a été inventé ?"
  objective: "Isoler les 5 champs bruts d'un relevé système, reconnaître les 3 angles morts d'un capteur, recouper des sources indépendantes et rédiger un constat rigoureux."
  explanation:
    - "Un service serveur ne voit jamais la personne derrière le clavier ni son intention : il n'enregistre que les paramètres techniques reçus sur son interface réseau."
    - "Une observation brute nomme sa source et restitue exactement les champs enregistrés. Toute attribution d'auteur, d'intention ou de provenance non mesurée est une hypothèse à tester par recoupement indépendant."
  workedExample:
    title: "Autopsie des 3 lignes de 08:14 UTC sur srv-paie-01"
    startingPoint: |
      Oct 24 08:14:02 srv-paie-01 sshd[18420]: Failed password for c.moreau from 10.24.8.19 port 42118 ssh2
      Oct 24 08:14:05 srv-paie-01 sshd[18423]: Failed password for c.moreau from 10.24.8.19 port 42120 ssh2
      Oct 24 08:14:09 srv-paie-01 sshd[18427]: Failed password for c.moreau from 10.24.8.19 port 42124 ssh2
    steps:
      - "Isoler les 5 champs mesurés : horodatage UTC (08:14:02 à 08:14:09), service sshd, résultat Failed password, compte demandé c.moreau et IP privée interne 10.24.8.19."
      - "Écarter les deux ajouts non prouvés de l'alerte (« attaquant externe » est contredit par la plage privée RFC 1918 ; « force brute » suppose une intention non mesurée)."
      - "Ouvrir trois hypothèses compatibles (H1 erreur humaine, H2 script de sauvegarde expiré, H3 session shell sur 10.24.8.19) puis les filtrer via la CMDB et les journaux locaux de 10.24.8.19."
    conclusion: "Avec 1 source (sshd), 3 hypothèses restent ouvertes. Le croisement de la CMDB puis des journaux locaux de 10.24.8.19 permet seul d'écarter les pistes incompatibles."
  experience:
    componentId: "observation-workbench"
    instruction: "1. Laissez le journal sshd seul actif et changez la cause amont sur 10.24.8.19. 2. Activez l'inventaire réseau (Source 2). 3. Comparez les journaux locaux (Cas 3A et Cas 3B) et observez l'impact d'une conclusion prématurée."
    observe: "Le relevé sshd reste strictement identique quelle que soit la cause amont simulée, tandis que les pistes compatibles passent de 3 à 2 puis à 1 lorsque des sources indépendantes sont recoupées."
    modelLimits: "Modèle borné à 5 champs normalisés, 3 hypothèses candidates et 3 sources locales. En production, contrôlez systématiquement la synchronisation horaire NTP, les équipements NAT/relais intermédiaires et l'intégrité de la collecte centralisée."
  misconception:
    claim: "Qualifier trois refus rapides de « tentative d'intrusion » dès l'observation brute est plus prudent en sécurité."
    correction: "Au contraire : injecter une conclusion non vérifiée dans les faits déclenche des coupures de service inutiles ou oriente l'équipe sur une fausse piste. Séparez toujours le fait brut des hypothèses à tester."
  takeaway: "Structurez chaque analyse en trois volets : (1) observation brute attribuée à sa source, (2) hypothèses compatibles bénignes et hostiles, (3) sources indépendantes à recouper."
  transferQuestion: "Sur le serveur interne srv-fichiers-02, le programme de sauvegarde enregistre : 16:40:05 UTC | service=backup-agent | event=UPLOAD_REJECTED | file=archives-rh.zip | account=svc-sauvegarde | reason=quota_exceeded. Rédigez (1) l'observation brute stricte, (2) deux hypothèses compatibles et (3) la source indépendante à consulter pour trancher."
externalLabs:
  - id: lab-local-log-decomposition
    title: "Atelier autonome : décomposer deux relevés terrain en trois volets"
    provider: "Activité locale guidée (référence NIST SP 800-92)"
    url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf"
    description: "Rédiger hors ligne, sur deux entrées de journal inédites, un ticket d'analyse séparant observation brute, hypothèses compatibles et sources de recoupement."
    estimatedMinutes: 10
    localSteps:
      - "Lisez la trace A (16:40:05 UTC | service=backup-agent | event=UPLOAD_REJECTED | file=archives-rh.zip | account=svc-sauvegarde | reason=quota_exceeded sur srv-fichiers-02) et la trace B (11:05:18 UTC | service=vpn-gateway | event=SESSION_CLOSED | account=m.diallo | source_ip=198.51.100.42 | reason=idle_timeout sur passerelle-acces-01)."
      - "Pour chaque trace, rédigez en une phrase l'observation brute en citant la source et ses champs exacts, sans adjectif d'intention."
      - "Pour chaque trace, formulez deux hypothèses compatibles (une opérationnelle bénigne, une atypique) et nommez la source indépendante qui les départage."
      - "Vérifiez vos textes sur quatre critères : source nommée, champs exacts, aucun mot d'intention dans les faits, action proportionnée."
