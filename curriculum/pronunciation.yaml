# Dictionnaire global de prononciation cyber FR/EN pour Gemini 3.8 Flash TTS
# Règles réutilisables sur l'ensemble des 160 unités du programme V4.
# Les fixtures spécifiques à un cours (IPs, noms de serveurs fictifs) vont dans lessons/<slug>/pronunciation.yaml.
version: "2.0"
replacements:
  - match: "/var/log/auth.log"
    say: "slash var slash log slash auth point log"
  - match: "auth.log"
    say: "auth point log"
  - match: "backup-agent"
    say: "backup agent"
  - match: "SSH"
    say: "S S H"
  - match: "VPN"
    say: "V P N"
  - match: "IP"
    say: "I P"
  - match: "/var/log/cron"
    say: "slash var slash log slash cron"
  - match: "/var/log/audit/audit.log"
    say: "slash var slash log slash audit slash audit point log"
  - match: "/etc/shadow"
    say: "slash etc slash shadow"
  - match: "AUTH_FAILURE"
    say: "AUTH FAILURE"
  - match: "AUTH_SUCCESS"
    say: "AUTH SUCCESS"
  - match: "EXECUTION_BLOCKED"
    say: "EXECUTION BLOCKED"
  - match: "UPLOAD_REJECTED"
    say: "UPLOAD REJECTED"
  - match: "quota_exceeded"
    say: "quota dépassé"
  - match: "unsigned_script"
    say: "script non signé"
  - match: "source_ip"
    say: "source I P"
  - match: "sshd"
    say: "S S H D"
  - match: "OpenSSH"
    say: "Open S S H"
  - match: "CMDB"
    say: "C M D B"
  - match: "SIEM"
    say: "S I E M"
  - match: "EDR"
    say: "E D R"
  - match: "NTP"
    say: "N T P"
  - match: "UTC"
    say: "U T C"
  - match: "SOC"
    say: "S O C"
  - match: "TCP"
    say: "T C P"
  - match: "UDP"
    say: "U D P"
  - match: "DNS"
    say: "D N S"
  - match: "PTR"
    say: "P T R"
  - match: "NAT"
    say: "N A T"
  - match: "HTTP"
    say: "H T T P"
  - match: "NXDOMAIN"
    say: "N X domain"
  - match: "SQLi"
    say: "S Q L i"
  - match: "XSS"
    say: "X S S"
  - match: "IDOR"
    say: "I D O R"
  - match: "WORM"
    say: "W O R M"
  - match: "PID"
    say: "P I D"
  - match: "wtmp"
    say: "W T M P"
  - match: "auditd"
    say: "audit D"
  - match: "NIST SP 800-92"
    say: "NIST S P huit cent quatre-vingt-douze"
  - match: "NIST SP 800-61r3"
    say: "NIST S P huit cent soixante et un révision trois"
  - match: "RFC 1918"
    say: "R F C mille neuf cent dix-huit"
  - match: "10.0.0.0/8"
    say: "dix point zéro point zéro point zéro slash huit"
  - match: "172.16.0.0/12"
    say: "cent soixante-douze point seize slash douze"
  - match: "192.168.0.0/16"
    say: "cent quatre-vingt-douze point cent soixante-huit slash seize"
  - match: "pts/3"
    say: "P T S trois"
